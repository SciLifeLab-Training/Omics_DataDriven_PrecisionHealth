project:
  type: website


# several branches can be specified here
branches:
  - branch: "release-2504"     # change this to the release branch
    output-dir: "2504"         # change this to year and month of the course instance

website:
  title: "Omics and data driven precision health"
  sidebar:
    style: "floating"
    background: "#F4F6F6"
    fontsize: 30px
    search: true
    contents: 
      - index.qmd 
      - setup.qmd
      - schedule.qmd
  navbar:
    background: "#A7C947"
    logo: "img/SciLifeLab_Logotype_NEG.png"
  favicon: "img/SciLifeLab_Logotype_NEG.png"


format:
  html:
    theme: cosmo
    css: styles.css
    toc: true

execute:
  freeze: auto

